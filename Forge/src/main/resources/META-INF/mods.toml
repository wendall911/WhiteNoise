modLoader="javafml"
loaderVersion="${forge_version_range}"
license="${license}"
issueTrackerURL="${issue_tracker}"
logoFile="${mod_id}_icon.png"
logoBlur=false
[[mods]]
    modId="${mod_id}"
    version="${version}"
    displayName="${mod_name}"
    authors="${mod_author}"
    credits="${mod_credits}"
    description='''
    ${mod_description}
    '''
    displayURL="${source}"
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${forge_mc_version_range}"
    ordering="NONE"
    side="BOTH"
