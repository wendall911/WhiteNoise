plugins {
    id 'idea'
    id 'maven-publish'
    id 'fabric-loom'
}

archivesBaseName = "${mod_id}-${minecraft_version}-fabric"

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${mappings_version}@zip")
    })
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":Common")

    modCompileOnly group: 'com.terraformersmc', name: 'modmenu', version: "${mod_menu_version}"
    modLocalRuntime group: 'com.terraformersmc', name: 'modmenu', version: "${mod_menu_version}"

    implementation group: 'com.electronwill.night-config', name: 'core', version: "${nightconfig_version}"
    implementation group: 'com.electronwill.night-config', name: 'toml', version: "${nightconfig_version}"
    include group: 'com.electronwill.night-config', name: 'core', version: "${nightconfig_version}"
    include group: 'com.electronwill.night-config', name: 'toml', version: "${nightconfig_version}"
}

loom {
    runs {
        client {
            client()
            source sourceSets.test
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

sourceSets {
    main {
        resources {
            srcDirs += "licenses"
        }
    }
}

ext.resourceTargets = ['fabric.mod.json', 'pack.mcmeta']
ext.replaceProperties = [
    'version': version,
    'fabric_mc_version_range': fabric_mc_version_range,
    'license': license,
    'mod_id': mod_id,
    'mod_author': mod_author,
    'mod_description': mod_description,
    'mod_display_name': mod_display_name,
    'mod_name': mod_name,
    'fabric_loader_min_version': fabric_loader_min_version,
    'mod_credits': mod_credits,
    'java_version': java_version,
    'pack_format': pack_format
]

processResources {
    from project(":Common").sourceSets.main.resources
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

processTestResources {
    filesMatching(resourceTargets) {
        expand(project.properties)
    }
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                url 'file://' + System.getenv('local_maven')
            }
        }
    }
}
